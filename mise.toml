# The rebuild loop needs a file watcher, and it is the only project here that does. Pinned to
# a major like everything in the workspace list one directory up.
[tools]
watchexec = "2"

[tasks.check]
description = "Type-check the crate"
run = "cargo check"

[tasks.lint]
description = "Lint the crate"
run = "cargo clippy --all-targets"

[tasks.verify]
description = "Everything a change has to pass"
depends = ["check", "lint"]

# Two loops, and only the outer one is here. Appearance lives in screen.style, which the
# running screen re-reads by itself, so this deliberately does not watch it -- a saved colour
# should reach the window without the window closing. Source changes cannot work that way, and
# get the blunt version: kill, rebuild, reopen. The window remembers its own frame, so it
# reopens where it was rather than back in the middle of the display.
#
# The extension filter is what narrows this to source, rather than --watch: watchexec 2.7
# rejects every relative path given to --watch, so naming src/ there fails outright and the
# working directory it defaults to is the honest way to say it. screen.style is excluded by
# having neither extension, which is the behaviour wanted anyway.
#
# --project-origin is the price of this repository sitting inside the workspace. watchexec
# walks up looking for ignore files and finds the workspace's, which ignores repos/*/ -- so
# every file here reads as ignored and nothing ever changes. Stating the origin stops the
# walk here, which keeps this project's own .gitignore doing its job: without it, turning the
# ignore files off wholesale is the only way to see a change, and then target/ is watched too
# and the file watcher buckles under it.
[tasks.screen]
description = "Open the black screen, rebuilding and reopening it as the source changes"
run = "watchexec --restart --project-origin . --exts rs,toml -- cargo run --release -- screen"

# The verbs the workspace one directory up dispatches to: `mise run update|clean|fmt [name]`.
# Each takes --dry-run and keeps the promises the workspace's spec/architecture/repos.md lists
# under "What a repository's task owes the verb"; the revert after a failed verify is the
# workspace's, so `update` neither verifies nor reverts.
[tasks.update]
description = "Move its own tools and the crates within their bounds, and name what waits beyond: `update [--dry-run] [--major]`"
usage = '''
flag "-n --dry-run" help="Say what would move and write nothing"
flag "--major" help="Cross the ranges Cargo.toml declares"
'''
run = '''
n=${usage_dry_run:+--dry-run}
# Its own [tools] first, then cargo.
mise upgrade --local $n
if [ -n "${usage_major:-}" ]; then cargo upgrade --incompatible $n; fi
cargo update $n
[ -z "${usage_major:-}" ] || exit 0
echo
echo "Beyond the ranges Cargo.toml declares:"
if ! cargo upgrade --version >/dev/null 2>&1; then
	echo "  cargo upgrade is missing, so no crate's major was checked; cargo-edit supplies it"
	exit 0
fi
beyond=$(cargo upgrade --incompatible --dry-run 2>/dev/null)
echo "${beyond:-  nothing; every dependency is at the top of its range}"
'''

[tasks.clean]
description = "Remove what cargo built: `clean [--dry-run]`"
usage = 'flag "-n --dry-run" help="Say what would go and remove nothing"'
run = "cargo clean ${usage_dry_run:+--dry-run}"

# The file set is jj.toml's, so `fmt` and the formatting a commit gets agree.
[tasks.fmt]
description = "Format the Rust and the prose beside it, with jj.toml's formatters: `fmt [--dry-run]`"
usage = 'flag "-n --dry-run" help="List the files that would change and write nothing"'
run = '''
files='**/*.{ts,tsx,mts,cts,js,mjs,cjs,jsx,css,json,jsonc,md,svelte}'
if [ -n "${usage_dry_run:-}" ]; then
	cargo fmt --all --check --message-format short || true
	oxfmt --list-different --no-error-on-unmatched-pattern "$files" || true
else
	cargo fmt --all
	oxfmt --no-error-on-unmatched-pattern "$files"
fi
'''
