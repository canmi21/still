# Cargo walks up the filesystem and would otherwise treat this crate as a member of the
# workspace this directory sits in. An empty table stops that walk.
[workspace]

[package]
name = "still"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Still your Mac. Clean it safely."
repository = "https://github.com/canmi21/still"

[[bin]]
name = "still"
path = "src/main.rs"

[dependencies]
core-foundation = "0.10"

# Formatting is rustfmt's and the linter must not report it; see rustfmt.toml.
[lints.clippy]
correctness = "deny"
suspicious = "deny"
complexity = "warn"

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3

# A background daemon is optimised for what it costs at rest, not for how fast it builds.
# `panic = "abort"` is a safety property rather than a size one: a panic inside the event tap
# callback would otherwise unwind across an FFI boundary, and aborting instead kills the
# process, which is what releases the keyboard.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
